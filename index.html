<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ДИАГНОСТИКА v2 - другой метод</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 16px;
            margin: 0;
        }
        .log {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .log-error { color: #ff6b6b; }
        .log-success { color: #51cf66; }
        .log-info { color: #4dabf7; }
        button {
            background: #4dabf7;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
        }
        .status {
            background: #2d2d44;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            font-weight: bold;
        }
        video {
            width: 100%;
            border-radius: 16px;
            background: #000;
            margin-top: 10px;
        }
        .test-image {
            margin-top: 20px;
            padding: 12px;
            background: #2d2d44;
            border-radius: 12px;
        }
        canvas {
            max-width: 100%;
            margin-top: 10px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <h1>🔬 ДИАГНОСТИКА v2</h1>
    
    <button id="startBtn">🎥 ЗАПУСТИТЬ КАМЕРУ</button>
    <button id="stopBtn">⏹️ ОСТАНОВИТЬ</button>
    <button id="testStaticBtn">🧪 ТЕСТ: распознать статический QR</button>
    
    <div class="status" id="status">⚡ Готов</div>
    
    <div id="videoContainer" style="display: none;">
        <video id="video" autoplay playsinline muted></video>
    </div>
    
    <div class="test-image" id="testArea" style="display: none;">
        <div>📌 Тестовая область (нажмите кнопку выше для теста)</div>
        <canvas id="testCanvas" width="300" height="300"></canvas>
        <div id="testResult"></div>
    </div>
    
    <div class="log" id="log">
        <div class="log-entry">📋 Журнал диагностики v2...</div>
    </div>

    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    
    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const testStaticBtn = document.getElementById('testStaticBtn');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('videoContainer');
        const testArea = document.getElementById('testArea');
        const testCanvas = document.getElementById('testCanvas');
        const testResult = document.getElementById('testResult');
        
        let currentStream = null;
        let scanInterval = null;
        let reader = null;  // BrowserMultiFormatReader
        let isScanning = false;
        
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            entry.scrollIntoView({ behavior: 'smooth', block: 'end' });
            console.log(message);
        }
        
        function setStatus(text, isError = false) {
            statusDiv.textContent = text;
            statusDiv.style.background = isError ? '#5c3b3b' : '#2d2d44';
        }
        
        // Используем BrowserMultiFormatReader (проще и надёжнее)
        async function initReader() {
            addLog('🔧 Инициализация BrowserMultiFormatReader...', 'info');
            if (!window.ZXing) {
                addLog('❌ ZXing не загружен!', 'error');
                return false;
            }
            reader = new ZXing.BrowserMultiFormatReader();
            addLog('✅ BrowserMultiFormatReader готов', 'success');
            return true;
        }
        
        // Тест: распознать статический QR-код (сгенерированный на canvas)
        function testStaticQR() {
            addLog('🧪 Запуск теста с статическим QR...', 'info');
            testArea.style.display = 'block';
            
            // Генерируем простой QR-код с текстом "TEST123"
            const ctx = testCanvas.getContext('2d');
            testCanvas.width = 300;
            testCanvas.height = 300;
            
            // Рисуем белый фон
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 300, 300);
            
            // Простой чёрный квадрат в центре (имитация кода)
            ctx.fillStyle = 'black';
            ctx.fillRect(50, 50, 200, 200);
            
            // Рисуем простой паттерн (имитация QR)
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(70 + i*40, 70, 20, 20);
                ctx.fillRect(70 + i*40, 210, 20, 20);
                ctx.fillRect(70, 70 + i*40, 20, 20);
                ctx.fillRect(210, 70 + i*40, 20, 20);
            }
            
            testResult.innerHTML = '⏳ Пытаемся распознать сгенерированный QR...';
            
            // Пробуем распознать
            reader.decodeFromImageElement(testCanvas)
                .then(result => {
                    testResult.innerHTML = `✅ УСПЕХ! Распознано: "${result.getText()}"`;
                    addLog(`🎉 Тестовый QR распознан: ${result.getText()}`, 'success');
                })
                .catch(err => {
                    testResult.innerHTML = `❌ НЕ РАСПОЗНАНО: ${err.message}`;
                    addLog(`❌ Тестовый QR не распознан: ${err.message}`, 'error');
                });
        }
        
        // Захват кадра и распознавание
        async function captureAndDecode() {
            if (!isScanning) return;
            if (!video.videoWidth || !video.videoHeight) {
                return;
            }
            
            // Создаём canvas и копируем кадр
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Рисуем видео на canvas (без зеркалирования)
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            try {
                // Пробуем распознать через BrowserMultiFormatReader
                const result = await reader.decodeFromImageElement(canvas);
                if (result && result.getText()) {
                    addLog(`🎉🎉🎉 РАСПОЗНАНО! QR: "${result.getText()}"`, 'success');
                    setStatus(`✅ РАСПОЗНАНО: ${result.getText().substring(0, 50)}`);
                    stopScanning();
                }
            } catch (e) {
                // QR не найден — тихо игнорируем
                // addLog(`QR не найден: ${e.message}`, 'warning');
            }
        }
        
        async function startScanning() {
            if (isScanning) {
                addLog('⚠️ Уже сканируем', 'warning');
                return;
            }
            
            await initReader();
            
            addLog('📷 Запрос камеры...', 'info');
            
            // Пробуем разные настройки камеры
            const constraints = {
                video: {
                    facingMode: { exact: 'environment' },
                    width: { min: 640, ideal: 1280 },
                    height: { min: 480, ideal: 720 }
                }
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                videoContainer.style.display = 'block';
                
                video.onloadedmetadata = () => {
                    video.play();
                    addLog(`✅ Видео запущено, размер: ${video.videoWidth}x${video.videoHeight}`, 'success');
                    setStatus('🔍 Сканируем... наведите на QR-код');
                    
                    isScanning = true;
                    
                    // Сканируем каждые 500 мс (не слишком часто)
                    scanInterval = setInterval(() => {
                        captureAndDecode();
                    }, 500);
                    
                    addLog('🔄 Цикл сканирования запущен (каждые 500 мс)', 'success');
                };
                
            } catch (err) {
                addLog(`❌ Ошибка: ${err.message}`, 'error');
                setStatus(`Ошибка: ${err.message}`, true);
                
                // Пробуем без exact
                addLog('🔄 Пробуем без exact facingMode...', 'info');
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' }
                    });
                    currentStream = fallbackStream;
                    video.srcObject = fallbackStream;
                    videoContainer.style.display = 'block';
                    video.play();
                    addLog('✅ Запасной вариант сработал', 'success');
                    setStatus('🔍 Сканируем...');
                    isScanning = true;
                    scanInterval = setInterval(() => captureAndDecode(), 500);
                } catch (e2) {
                    addLog(`❌ Запасной вариант тоже не сработал: ${e2.message}`, 'error');
                }
            }
        }
        
        function stopScanning() {
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            isScanning = false;
            videoContainer.style.display = 'none';
            if (video.srcObject) {
                video.srcObject = null;
            }
            addLog('⏹️ Сканирование остановлено', 'info');
            setStatus('⏸️ Остановлено');
        }
        
        startBtn.addEventListener('click', startScanning);
        stopBtn.addEventListener('click', stopScanning);
        testStaticBtn.addEventListener('click', testStaticQR);
        
        addLog('🚀 v2 загружена', 'success');
        addLog('📌 Нажмите "ТЕСТ: распознать статический QR" сначала', 'info');
    </script>
</body>
</html>
